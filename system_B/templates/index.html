
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Tarefas</title>
</head>
<body>
    <h1>Sistema de Tarefas</h1>
    <p>Entre com sua conta para acessar suas tarefas.</p>

    <form action="/login" method="post">
        <div>
            <label for="username">Usuário:</label>
            <input
                type="text"
                id="username"
                name="username"
                required>
        </div>

        <br>

        <div>
            <label for="password">Senha:</label>
            <input
                type="password"
                id="password"
                name="password"
                required>
        </div>

        <br>

        <button type="submit">Entrar</button>
    </form>

    {% if message %}
        <p>{{ message }}</p>
    {% endif %}
</body>
</html>
